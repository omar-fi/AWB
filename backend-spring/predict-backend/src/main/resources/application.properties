# ===============================
# CONFIGURATION SERVEUR
# ===============================
spring.application.name=predict-backend
server.port=8080

# ===============================
# CONFIGURATION BASE DE DONNEES (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/attijari_predict_db?serverTimezone=UTC&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=INFO
# ===============================
# CONFIGURATION HIBERNATE / JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# ===============================
# CONFIGURATION APACHE KAFKA
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

# Configuration du Consumer (Pour recevoir les predictions de Python)
spring.kafka.consumer.group-id=predict-backend-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Configuration du Producer (Pour envoyer les transactions vers Python)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# ===============================
# CONFIGURATION EMAIL (GMAIL SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
